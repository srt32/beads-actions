name: Sync Beads to GitHub Issues

on:
  push:
    branches: [ main, copilot/** ]
    paths:
      - '.beads/**'

jobs:
  reverse-sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write    # Needed to close/reopen issues
      contents: read   # Needed to read .beads files
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install beads
        run: |
          curl -fsSL https://raw.githubusercontent.com/steveyegge/beads/main/scripts/install.sh | bash
          echo "$HOME/.beads/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci
        working-directory: ./scripts

      - name: Build scripts
        run: npm run build
        working-directory: ./scripts

      - name: Sync Beads tasks to GitHub issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run reverse-sync
        working-directory: ./scripts
