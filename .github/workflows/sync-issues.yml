name: Sync GitHub Issues to Beads

on:
  issues:
    types: [opened, edited, closed, reopened, deleted]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit and push .beads changes
      issues: read     # Needed to read issue details
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install beads
        run: |
          curl -fsSL https://raw.githubusercontent.com/steveyegge/beads/main/scripts/install.sh | bash
          echo "$HOME/.beads/bin" >> $GITHUB_PATH

      - name: Initialize beads if needed
        run: |
          if [ ! -d ".beads" ]; then
            bd init
          fi

      - name: Install dependencies
        run: npm ci
        working-directory: ./scripts

      - name: Sync issue to beads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
          ACTION: ${{ github.event.action }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: npm start
        working-directory: ./scripts

      - name: Commit and push beads changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .beads/
            git commit -m "Sync issue #${{ github.event.issue.number }}: ${{ github.event.action }}"
            git push
          fi
